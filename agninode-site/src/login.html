<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | AgniNode Cloud IoT</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <!-- Critical Preload Directives for Instant Rendering -->
  <link rel="preload" href="css/site.css" as="style">
  <link rel="preload" href="favicon.svg" as="image" type="image/svg+xml">
  <link rel="stylesheet" href="css/site.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      background: var(--bg-glass-card);
      border-radius: var(--radius-xl);
      padding: 40px;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(24px);
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .auth-input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(0,0,0,0.45);
      border-radius: var(--radius-sm);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), inset 0 2px 4px rgba(0,0,0,0.4);
      transition: all 0.2s ease;
    }
    .auth-input:focus {
      outline: none;
      box-shadow: 0 0 0 2px var(--fire-orange), 0 0 24px rgba(255, 107, 53, 0.35);
    }
    .auth-err {
      color: var(--status-alarm);
      font-size: 13px;
      min-height: 20px;
      margin: 0;
    }
    .role-btn {
      flex: 1;
      padding: 12px;
      background: rgba(255,255,255,0.06);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      transition: all 0.2s ease;
    }
    .role-btn:hover {
      background: rgba(255,255,255,0.12);
      color: #fff;
      transform: translateY(-1px);
    }
    .role-btn:hover {
      background: var(--bg-elevated);
      color: #fff;
      border-color: var(--border-bright);
    }
  </style>
</head>
<body class="auth-page">

  <div style="margin-bottom:28px">
    <a class="logo-brand" href="index.html" aria-label="AgniNode Home">
      <div class="logo-flame" aria-hidden="true">
          <img src="assets/images/agninode-logo-mark-white.png" alt="AgniNode Logo" class="logo-mark-img">
        </div>
      <span class="logo-text">Agni<span>Node</span></span>
    </a>
  </div>

  <main class="auth-card">
    <div>
      <h1 style="font-size:26px;color:#fff">Sign In to Dashboard</h1>
      <p style="font-size:13px;color:var(--text-muted);margin-top:4px">
        Manage devices, monitor live fire & arc telemetry, and acknowledge alarms.
      </p>
    </div>

    <!-- Live Firebase Auth Form -->
    <form id="real" style="display:flex;flex-direction:column;gap:14px">
      <div>
        <label style="display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px">Email Address</label>
        <input class="auth-input" id="em" type="email" placeholder="name@example.com" autocomplete="username" required aria-label="Email">
      </div>
      <div>
        <label style="display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px">Password</label>
        <input class="auth-input" id="pw" type="password" placeholder="••••••••" autocomplete="current-password" required aria-label="Password">
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;padding:12px">Sign In to Console</button>
      <button class="linkbtn" type="button" id="reset" style="font-size:13px;color:var(--text-dim);text-align:center;padding:4px">Forgot your password? Send reset email</button>
    </form>

    <!-- Simulated Demo Mode Picker (shown in DEMO mode or toggleable) -->
    <div id="demo" hidden style="background:rgba(255,255,255,0.03);border-radius:var(--radius-md);padding:18px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,0.06)">
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px">
        <strong>Demo Mode Active:</strong> Choose a simulated role to explore telemetry:
      </p>
      <div style="display:flex;gap:8px">
        <button class="role-btn" data-role="viewer">Viewer</button>
        <button class="role-btn" data-role="operator">Operator</button>
        <button class="role-btn" data-role="admin">Admin</button>
      </div>
    </div>

    <!-- Quick Demo Mode Toggle for Convenience -->
    <div id="demo-quick-access" style="padding-top:16px;text-align:center">
      <span style="font-size:12px;color:var(--text-dim);display:block;margin-bottom:8px">Or test instantly with simulated mock data:</span>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="role-btn" data-demo="viewer">Viewer Demo</button>
        <button class="role-btn" data-demo="operator">Operator Demo</button>
        <button class="role-btn" data-demo="admin">Admin Demo</button>
      </div>
    </div>

    <p class="auth-err" id="err" role="alert"></p>

    <div style="text-align:center;padding-top:14px">
      <a href="index.html" style="font-size:13px;color:var(--text-muted)">← Back to Product Overview</a>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
